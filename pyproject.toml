[project]
name = "mgd77-to-geoparquet"
version = "0.1.0"
description = "MGD77T/MGD77 to GeoParquet conversion toolkit."
readme = "README.md"
authors = [
    { name = "Rachel Peterson", email = "rachel.peterson-3@colorado.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.4",
    "pyarrow>=25.0.0",
    "pygmt>=0.19.0",
    "s3fs>=2024.1.0",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
mgd77-to-geoparquet = "mgd77_to_geoparquet.mgd77_to_geoparquet:main"
build-trackline-catalog = "trackline_geophysics_geoparquet_catalog_builder.trackline_geophysics_geoparquet_catalog_builder:main"
extract-trackline-data = "extract_trackline_geophysics_data.extract_trackline_geophysics_data:main"
